<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yoana Karageorgieva Portfolio</title>
<meta name="description" content="Portfolio of Yoana Karageorgieva: short documentaries, reels, news broadcasting, articles and photography.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="intro">
  <div class="land" id="land" aria-hidden="true"></div>
  <div class="wrap">
    <div class="card-text">
      <small>Digital media portfolio</small>
      <h1 id="name">Yoana Karageorgieva</h1>
      <div id="introText"></div>
    </div>
    <div class="portrait" id="portrait"><span>Portrait</span></div>
  </div>
</header>

<main>
  <section class="sections"><div class="wrap">
    <h2>My work</h2>
    <p class="lede">Choose a section to see the work inside it.</p>
    <div class="grid" id="tiles"></div>
  </div></section>

  <div class="panel" id="panel"><div class="wrap">
    <div id="sectionView"></div>
    <button class="next" id="nextBtn" type="button">Next section →</button>
  </div></div>
</main>

<footer><div class="wrap" id="foot">Yoana Karageorgieva</div></footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
